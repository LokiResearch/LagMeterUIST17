<!doctype html>
<!-- from : https://www.alsacreations.com/tuto/lire/1572-webgl-3d-three-canvas-threejs.html -->
<html>
  <head>
    <title>Flashing app using ThreeJS / WebGL</title>
    <meta charset="utf-8">
    <link  href="css/main.css" rel="stylesheet"/>
  </head>
<body>

  <div id="container"></div>

  <script src="/three.min.js"></script>
  <script src="/main.js"></script>
  <script type="text/javascript">
  <!-- C'est ici que nous utiliserons Three.js -->

    var renderer, scene, camera;

    function changeColor(color){
      renderer.setClearColor(color, 1);
      renderer.render( scene, camera );
    }

    function onDown(){
      requestAnimationFrame(
        function(){
          changeColor(COLORS.DOWN)
        }
      );
    }

    function onUp(){
      requestAnimationFrame(
        function(){
          changeColor(COLORS.UP)
        }
      );    }

    init();

    function init(){
      // on initialise le moteur de rendu
      renderer = new THREE.WebGLRenderer();
      renderer.setClearColor("#FFFFFF", 1);

      // si WebGL ne fonctionne pas sur votre navigateur vous pouvez utiliser le moteur de rendu Canvas à la place
      // renderer = new THREE.CanvasRenderer();
      renderer.setSize( window.innerWidth, window.innerHeight );
      document.getElementById('container').appendChild(renderer.domElement);

      // on initialise la scène
      scene = new THREE.Scene();

      // on initialise la camera que l’on place ensuite sur la scène
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 10000 );
      camera.position.set(0, 0, 1000);
      scene.add(camera);

      // on effectue le rendu de la scène
      renderer.render( scene, camera );
      bind("webgl-threeJS", onDown, onUp);

    }

  </script>
</body>
</html>
