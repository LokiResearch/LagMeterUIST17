<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashing app using a canvas element</title>

  <style type="text/css">
    * { margin: 0; padding: 0;}

    body, html { height:100%; }

    #canvas {
      position:absolute;
      width:100%;
      height:100%;
    }
  </style>
  <script type="text/javascript" src="/main.js"></script>
  <script type="application/x-javascript">
    function whenLoaded(){
      canvas = document.getElementById("canvas");
      ctx = canvas.getContext("2d");

      function changeCanvasColor(color){
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function onDown(){
        changeCanvasColor(COLORS.DOWN);
        requestAnimationFrame(
          function(){
            changeColor(COLORS.DOWN)
        }
      );
      }

      function onUp(){
        changeCanvasColor(COLORS.UP);
      }

      bind("CanvasJS", onDown, onUp);
    }
  </script>
</head>
<body onload="whenLoaded()">
 <canvas id="canvas" width="300" height="300"></canvas>
</body>

</html>
